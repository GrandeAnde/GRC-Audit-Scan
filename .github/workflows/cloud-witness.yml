name: "Cloud Witness: External Audit"

on:
  workflow_dispatch:      # Allows you to click "Run Now"
  schedule:
    - cron: '0 8 * * *'   # Runs daily at 800 UTC

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    steps:
      # 1. Setup: Install the scanner
      - name: Install Nmap
        run: sudo apt-get update && sudo apt-get install -y nmap

      # 2. Execution: Run the Scan (Targeting Google DNS as a safe test)
      - name: Conduct Port Audit (Target: 8.8.8.8)
        run: |
          # Create a clean filename with today's date
          FILENAME="audit_report_$(date +'%Y-%m-%d').txt"
          
          # Save filename to Environment Variable so next steps can see it
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          
          # Write the Evidence Header
          echo "--- INDEPENDENT AUDIT REPORT ---" > $FILENAME
          echo "TIMESTAMP: $(date -u)" >> $FILENAME
          echo "TARGET: 8.8.8.8" >> $FILENAME
          echo "CONTROL: NIST 3.13.1 (Boundary Protection)" >> $FILENAME
          echo "----------------------------------------" >> $FILENAME
          
          # Run Nmap (Fast scan of top 100 ports)
          nmap -F 8.8.8.8 >> $FILENAME
          
          echo "--- END OF EVIDENCE ---" >> $FILENAME

      # 3. Preservation: Upload Evidence to Azure Blob
      - name: Vault Evidence in Azure
        run: |
          # Make SAS URL and insert the filename so it becomes: https://host/container/filename.txt?token
          
          SAS_URL="${{ secrets.AZURE_SAS_URL }}"
          
          # Split the URL into two parts: The Base (before ?) and the Token (after ?)
          BASE_URL=$(echo $SAS_URL | cut -d'?' -f1)
          SAS_TOKEN=$(echo $SAS_URL | cut -d'?' -f2)
          
          # Reassemble the URL with the filename inside
          UPLOAD_URL="$BASE_URL/$FILENAME?$SAS_TOKEN"
          
          # Upload using curl (PUT request)
          # -H tells Azure this is a Block Blob
          curl -X PUT -T $FILENAME -H "x-ms-blob-type: BlockBlob" "$UPLOAD_URL"

      - name: Audit Log
        run: echo "SUCCESS: Evidence $FILENAME has been vaulted in Azure."
